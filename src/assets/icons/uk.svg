<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue background -->
  <rect width="32" height="32" fill="#012169"/>
  
  <!-- White diagonal cross (St. Andrew) -->
  <path d="M0,0 L32,32 M32,0 L0,32" stroke="#FFFFFF" stroke-width="3"/>
  
  <!-- Red diagonal cross (St. Patrick) -->
  <path d="M0,0 L32,32 M32,0 L0,32" stroke="#C8102E" stroke-width="1.5"/>
  
  <!-- White cross (St. George) -->
  <path d="M16,0 L16,32 M0,16 L32,16" stroke="#FFFFFF" stroke-width="5"/>
  
  <!-- Red cross (St. George) -->
  <path d="M16,0 L16,32 M0,16 L32,16" stroke="#C8102E" stroke-width="3"/>
</svg>